name: Atualizar portfolio

on:
  push:
    paths:
      - "fotos/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar lista de fotos
        run: node scripts/gerar-portfolio.js
      - name: Salvar se mudou
        run: |
          git config user.name "portfolio-bot"
          git config user.email "portfolio-bot@users.noreply.github.com"
          git add portfolio/fotos.json
          git diff --cached --quiet || (git commit -m "Atualiza portfolio" && git pull --rebase origin main && git push)
